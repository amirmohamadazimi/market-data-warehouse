[project]
name = "market-data-warehouse"
version = "0.1.0"
description = "TSE + global daily bars in PostgreSQL: idempotent loads, SQL analytics views, data-quality checks, and a small app"
readme = "README.md"
authors = [
    { name = "Amir Azimi", email = "amirazimimhm@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.5",
    "pyarrow>=25.0.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "pytse-client>=0.19.1",
    "sqlalchemy>=2.0.52",
    "streamlit>=1.64.0",
    "yfinance>=1.7.0",
]

[tool.uv]
# Not an installable package: everything runs from the repo root as
# `python -m warehouse ...` and `streamlit run app.py`.
package = false
