[project]
name = "market-data-warehouse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Amir Azimi", email = "amirazimimhm@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.5.5",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.5",
    "pyarrow>=25.0.1",
    "pytest>=9.1.1",
    "pytse-client>=0.19.1",
    "sqlalchemy>=2.0.52",
    "yfinance>=1.7.0",
]

[project.scripts]
market-data-warehouse = "market_data_warehouse:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
